services:
  db:
    image: postgres:17-alpine
    container_name: recover-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recover
      POSTGRES_PASSWORD: recover
      POSTGRES_DB: recover
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recover -d recover"]
      interval: 5s
      timeout: 5s
      retries: 10
